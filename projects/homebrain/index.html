<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧠 HomeBrain</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0f; color: #fff; font-family: 'Segoe UI', sans-serif; }
        header { background: #111; padding: 20px 40px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 28px; }
        header span { color: #888; font-size: 14px; }
        .run-all { background: #6c63ff; color: #fff; border: none; padding: 10px 24px; border-radius: 8px; cursor: pointer; font-size: 14px; }
        .run-all:hover { background: #574fd6; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; padding: 40px; }
        .card { background: #111; border: 1px solid #222; border-radius: 16px; padding: 24px; transition: all 0.3s; }
        .card:hover { border-color: #6c63ff; transform: translateY(-2px); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .card-title { font-size: 18px; font-weight: bold; }
        .badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; }
        .badge.idle { background: #1a1a2e; color: #888; }
        .badge.running { background: #1a2e1a; color: #4caf50; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .card-desc { color: #888; font-size: 14px; margin-bottom: 16px; }
        .card-result { background: #0a0a0f; border-radius: 8px; padding: 12px; font-size: 13px; color: #ccc; min-height: 60px; margin-bottom: 16px; line-height: 1.6; white-space: pre-wrap; }
        .card-footer { display: flex; justify-content: space-between; align-items: center; }
        .last-run { color: #555; font-size: 12px; }
        .run-btn { background: #6c63ff; color: #fff; border: none; padding: 8px 20px; border-radius: 8px; cursor: pointer; font-size: 13px; }
        .run-btn:hover { background: #574fd6; }
        .run-btn:disabled { background: #333; cursor: not-allowed; }
    </style>
</head>
<body>
    <header>
        <h1>🧠 HomeBrain</h1>
        <div style="display:flex;align-items:center;gap:20px;">
            <span id="clock"></span>
            <button class="run-all" onclick="runAll()">▶ Alle starten</button>
        </div>
    </header>
    <div class="grid" id="grid"></div>
    <script>
        function updateClock() {
            document.getElementById('clock').textContent = new Date().toLocaleTimeString('de-CH');
        }
        setInterval(updateClock, 1000);
        updateClock();

        async function loadAgents() {
            const res = await fetch('/api/agents');
            const agents = await res.json();
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            for (const [id, agent] of Object.entries(agents)) {
                grid.innerHTML += `
                <div class="card" id="card-${id}">
                    <div class="card-header">
                        <div class="card-title">${agent.name}</div>
                        <span class="badge ${agent.status}">${agent.status === 'running' ? '⚡ Running' : '● Idle'}</span>
                    </div>
                    <div class="card-desc">${agent.description}</div>
                    <div class="card-result">${agent.last_result || 'Noch nicht ausgeführt...'}</div>
                    <div class="card-footer">
                        <span class="last-run">${agent.last_run ? '🕐 ' + agent.last_run : 'Nie ausgeführt'}</span>
                        <button class="run-btn" onclick="runAgent('${id}')" ${agent.status === 'running' ? 'disabled' : ''}>▶ Starten</button>
                    </div>
                </div>`;
            }
        }

        async function runAgent(id) {
            await fetch(`/api/agents/${id}/run`, {method: 'POST'});
            loadAgents();
        }

        async function runAll() {
            await fetch('/api/agents/run-all', {method: 'POST'});
            loadAgents();
        }

        setInterval(loadAgents, 3000);
        loadAgents();
    </script>
</body>
</html>
